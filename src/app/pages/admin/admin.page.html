<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>Panel de administración</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="logout()">
        <ion-icon slot="start" name="log-out-outline"></ion-icon>
        Salir
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding" [fullscreen]="true">
  <ion-card>
    <ion-card-header>
      <ion-icon name="shield-checkmark-outline" class="ok-icon"></ion-icon>
      <ion-card-title>Bienvenido, {{ user()?.username }}</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      Has accedido a una ruta protegida por <strong>authGuard</strong>.
    </ion-card-content>
  </ion-card>

  <ion-list inset="true">
    <ion-item>
      <ion-label>
        <h3>Usuario</h3>
        <p>{{ user()?.username }}</p>
      </ion-label>
    </ion-item>
    <ion-item>
      <ion-label>
        <h3>Rol</h3>
        <p>{{ user()?.role }}</p>
      </ion-label>
    </ion-item>
    <ion-item>
      <ion-label>
        <h3>Persistencia</h3>
        <p>sessionStorage → DAM2_AUTH_SESSION</p>
      </ion-label>
    </ion-item>
  </ion-list>
</ion-content>
